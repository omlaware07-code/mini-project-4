---
- name: Configure Student Management Platform
  hosts: localhost
  connection: local
  become: true

  tasks:
    - name: Update package cache
      apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Ensure Docker is installed
      apt:
        name: docker.io
        state: present

    - name: Ensure Docker service is running
      service:
        name: docker
        state: started
        enabled: true

    - name: Create application directory
      file:
        path: /opt/student-platform
        state: directory
        mode: "0755"
